name: sql-tagged-templates-pg

services:
  db:
    image: postgres:18.1
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready', '-d', 'test']
      start_period: 5s
      interval: 2s
      timeout: 2s
      retries: 5
    ports:
      - 7887:5432
    volumes:
      - ./initial-db.sql:/docker-entrypoint-initdb.d/initial-db.sql
